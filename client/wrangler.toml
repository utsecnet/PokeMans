# Serves the built client and its images at https://pokemans.us/.
#
# A Worker rather than Pages because the images are read from R2 through a binding, which is
# what keeps the bucket private. Each future app is its own subdomain and its own Worker,
# deployed on its own schedule, sharing nothing.
#
#   npm run build
#   npx wrangler deploy        from client/

name = "pokemans"
main = "worker.js"

# Set so wrangler does not have to ask which account this belongs to. Without it, it calls
# /memberships -- a user-level endpoint an account-scoped token cannot read -- and the deploy
# fails with "Authentication failed (status: 400) [code: 9106]", which reads like a bad token
# rather than a missing field. Not a secret: it is in every dashboard URL and in the R2
# endpoint hostname.
account_id = "ec4277211bf09b65b26be2d074d89b5f"
compatibility_date = "2026-10-10"

[assets]
directory = "./dist"
binding = "ASSETS"
# Any path that is not a file is the router's business, so hand back index.html. Without
# this, a reload on /settings is a 404.
not_found_handling = "single-page-application"

# The images, read straight from R2 rather than over a public hostname. The bucket needs no
# public access this way, so nothing but this Worker can reach it.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "pokemans-images"

# The domain the app answers on from now on. custom_domain rather than a pattern and a
# zone_name because Cloudflare then writes the DNS record and issues the certificate
# itself: no placeholder A record aimed at an address nothing listens on, and no second
# place to remember when this file changes.
[[routes]]
pattern = "pokemans.us"
custom_domain = true

# The spelling with www, which people type whether or not anyone links it. Routed here so
# the Worker can send it to the bare name rather than serving a second copy of the site at
# a second address.
[[routes]]
pattern = "www.pokemans.us"
custom_domain = true

# Where the app answered before the move. It still answers -- with a 301, from the Worker.
# The route has to stay for that: a hostname with no route reaches no code and so cannot
# redirect anybody. Every link, bookmark and installed Android build still names it.
[[routes]]
pattern = "pokemans.utsec.net/*"
zone_name = "utsec.net"
