name: Feature Request
description: Request a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Only the first box is required. A rough idea is good, but specific is better. The more specific you can be, the better I can understand what it is you want.

  - type: textarea
    id: what
    attributes:
      label: What you would like it to do
      description: Describe what you would like the feature to do.
      placeholder: |
        Let me sort my collection by what each card is worth, so the expensive ones
        are together at the top.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What you are trying to get done
      description: >
        Tell me the why of what you want. Sometimes the feature we request isnt really the right answer, but if you can explain the "why" maybe I can find a better end result.
      placeholder: |
        I am working out what to insure, and I keep exporting the list to a spreadsheet
        to add it up.
    validations:
      required: false

  - type: dropdown
    id: where
    attributes:
      label: Where it belongs
      options:
        - Card list / browsing
        - A single card (the large view)
        - My collection
        - A want list
        - Search or filters
        - Signing in
        - Settings
        - Somewhere that does not exist yet
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        A sketch, a screenshot with something scribbled on it, or another site that does
        it well — all of it helps. Drag images straight into this box.
      placeholder: Drag images here, or leave this empty.
    validations:
      required: false
