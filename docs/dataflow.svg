<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 812" width="1168" height="812" role="img" aria-label="Data flow diagram showing trust boundaries between browser, API, Postgres and third-party services">
<title>Data flow diagram showing trust boundaries between browser, API, Postgres and third-party services</title>
<style>
  svg {
    --f-ink:#0d1418; --f-muted:#5b6a77; --f-surface:#ffffff; --f-surface2:#f4f7f9;
    --f-line:#c9d3db; --f-zone:#e7edf2; --f-zoneline:#a9b8c4; --f-accent:#17607d;
    --f-shared:#1f6feb; --f-user:#7b4bb7; --f-secret:#a92e26;
    font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --f-ink:#e6edf3; --f-muted:#93a4b3; --f-surface:#1a2027; --f-surface2:#151b21;
      --f-line:#39444f; --f-zone:#161c22; --f-zoneline:#3d4954; --f-accent:#5cc2e8;
      --f-shared:#6ea8fe; --f-user:#c08cf5; --f-secret:#f0837a;
    }
  }
  .zn   { fill:var(--dg-zone,var(--f-zone)); stroke:var(--dg-zoneline,var(--f-zoneline)); stroke-width:1.25; stroke-dasharray:5 4; }
  .zt   { fill:var(--dg-muted,var(--f-muted)); font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .zc   { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .bx   { fill:var(--dg-surface,var(--f-surface)); stroke:var(--dg-line,var(--f-line)); stroke-width:1.25; }
  .bx2  { fill:var(--dg-surface2,var(--f-surface2)); stroke:var(--dg-line,var(--f-line)); stroke-width:1.25; }
  .bt   { fill:var(--dg-ink,var(--f-ink)); font-size:14px; font-weight:600; }
  .bs   { fill:var(--dg-muted,var(--f-muted)); font-size:12px; }
  .bm   { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .ar   { fill:none; stroke:var(--dg-accent,var(--f-accent)); stroke-width:1.6; }
  .ard  { fill:none; stroke:var(--dg-muted,var(--f-muted)); stroke-width:1.4; stroke-dasharray:5 4; }
  .al   { fill:var(--dg-accent,var(--f-accent)); font-size:11.5px; font-weight:500;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .alm  { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .tb   { fill:none; stroke:var(--dg-secret,var(--f-secret)); stroke-width:1.4; stroke-dasharray:7 5; opacity:.75; }
  .tbt  { fill:var(--dg-secret,var(--f-secret)); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .ttl  { fill:var(--dg-ink,var(--f-ink)); font-size:15px; font-weight:700; letter-spacing:.02em;
          font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif; }
  .num  { fill:var(--dg-surface,var(--f-surface)); font-size:11px; font-weight:700;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-accent,var(--f-accent))"/>
  </marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-muted,var(--f-muted))"/>
  </marker>
</defs>
<text class="ttl" x="40" y="34">Figure 2 · Data flow across trust boundaries (Postgres)</text><line class="tb" x1="300" y1="56" x2="300" y2="792"/><text class="tbt" x="306" y="70">TB1 · internet → API</text><line class="tb" x1="700" y1="56" x2="700" y2="660"/><text class="tbt" x="706" y="70">TB2 · API → data (RLS)</text><rect class="tb" x="336" y="686" width="792" height="106" rx="8"/><text class="tbt" x="352" y="706">TB3 · outbound to untrusted third parties</text><rect class="bx" x="40" y="92" width="240" height="78" rx="5"/><text class="bt" x="54" y="115">User</text><text class="bs" x="54" y="134">Browser · unauthenticated</text><text class="bs" x="54" y="150">until step 1 completes</text><rect class="bx" x="40" y="560" width="240" height="78" rx="5"/><text class="bt" x="54" y="583">Scheduler</text><text class="bs" x="54" y="602">GitHub Actions</text><text class="bm" x="54" y="618">shared secret header</text><rect class="bx" x="340" y="92" width="300" height="66" rx="5"/><text class="bt" x="354" y="115">1.0  Authenticate</text><text class="bs" x="354" y="134">Supabase GoTrue · issues JWT</text><rect class="bx" x="340" y="186" width="300" height="66" rx="5"/><text class="bt" x="354" y="209">2.0  Browse catalogue</text><text class="bs" x="354" y="228">Public read · no user context</text><rect class="bx" x="340" y="280" width="300" height="82" rx="5"/><text class="bt" x="354" y="303">3.0  Read / write collection</text><text class="bm" x="354" y="322">auth.uid() bound to every row</text><text class="bs" x="354" y="338">Express API on Fly</text><rect class="bx" x="340" y="390" width="300" height="82" rx="5"/><text class="bt" x="354" y="413">4.0  Read price history</text><text class="bs" x="354" y="432">Filters on license_class</text><text class="bs" x="354" y="448">before any aggregate</text><rect class="bx" x="340" y="560" width="300" height="82" rx="5"/><text class="bt" x="354" y="583">5.0  Sync worker</text><text class="bs" x="354" y="602">Catalogue + prices + FX</text><text class="bs" x="354" y="618">Service role — bypasses RLS</text><rect class="zn" x="736" y="86" width="392" height="228" rx="8"/><text class="zt" x="750" y="107">Shared · read-only to clients</text><rect class="bx" x="752" y="120" width="360" height="56" rx="5"/><path d="M752.5,125 a5,5 0 0 1 5,-5 h0 v46 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-shared,var(--f-shared))"/>
<rect x="753" y="121" width="4" height="54" fill="var(--dg-shared,var(--f-shared))"/><text class="bt" x="770" y="143">catalog.*</text><text class="bm" x="770" y="162">cards 20,444 · variants 32,974</text><rect class="bx" x="752" y="184" width="360" height="56" rx="5"/><path d="M752.5,189 a5,5 0 0 1 5,-5 h0 v46 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-shared,var(--f-shared))"/>
<rect x="753" y="185" width="4" height="54" fill="var(--dg-shared,var(--f-shared))"/><text class="bt" x="770" y="207">market.price_history</text><text class="bm" x="770" y="226">license_class = 'shareable'</text><rect class="bx" x="752" y="248" width="360" height="52" rx="5"/><path d="M752.5,253 a5,5 0 0 1 5,-5 h0 v42 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-shared,var(--f-shared))"/>
<rect x="753" y="249" width="4" height="50" fill="var(--dg-shared,var(--f-shared))"/><text class="bt" x="770" y="271">market.fx_rates</text><text class="bm" x="770" y="290">ECB daily, per-date</text><rect class="zn" x="736" y="336" width="392" height="304" rx="8"/><text class="zt" x="750" y="357">Per user · RLS user_id = auth.uid()</text><rect class="bx" x="752" y="370" width="360" height="56" rx="5"/><path d="M752.5,375 a5,5 0 0 1 5,-5 h0 v46 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-user,var(--f-user))"/>
<rect x="753" y="371" width="4" height="54" fill="var(--dg-user,var(--f-user))"/><text class="bt" x="770" y="393">app.collection_boxes / entries</text><text class="bm" x="770" y="412">the irreplaceable data</text><rect class="bx" x="752" y="434" width="360" height="52" rx="5"/><path d="M752.5,439 a5,5 0 0 1 5,-5 h0 v42 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-user,var(--f-user))"/>
<rect x="753" y="435" width="4" height="50" fill="var(--dg-user,var(--f-user))"/><text class="bt" x="770" y="457">app.user_settings</text><text class="bm" x="770" y="476">display currency, theme</text><rect class="bx" x="752" y="494" width="360" height="56" rx="5"/><path d="M752.5,499 a5,5 0 0 1 5,-5 h0 v46 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-user,var(--f-user))"/>
<rect x="753" y="495" width="4" height="54" fill="var(--dg-user,var(--f-user))"/><text class="bt" x="770" y="517">market.price_history</text><text class="bm" x="770" y="536">license_class = 'per_user'</text><rect class="bx" x="752" y="558" width="360" height="66" rx="5"/><path d="M752.5,563 a5,5 0 0 1 5,-5 h0 v56 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-secret,var(--f-secret))"/>
<rect x="753" y="559" width="4" height="64" fill="var(--dg-secret,var(--f-secret))"/><text class="bt" x="770" y="581">app.linked_accounts</text><text class="bs" x="770" y="600">AES-256-GCM ciphertext only</text><text class="bm" x="770" y="616">key never leaves Fly secrets</text><rect class="bx2" x="356" y="716" width="230" height="58" rx="5"/><text class="bt" x="370" y="739">TCGdex</text><text class="bs" x="370" y="758">Catalogue + spot prices</text><rect class="bx2" x="606" y="716" width="250" height="58" rx="5"/><text class="bt" x="620" y="739">PokemonPriceTracker</text><text class="bs" x="620" y="758">User's own key</text><rect class="bx2" x="876" y="716" width="232" height="58" rx="5"/><text class="bt" x="890" y="739">Frankfurter · PokeAPI</text><text class="bs" x="890" y="758">FX + species</text><polyline class="ar" points="280,118 340,118" marker-end="url(#ah)"/><circle cx="310" cy="118" r="9" fill="var(--dg-accent,var(--f-accent))"/>
<text class="num" x="310" y="122" text-anchor="middle">1</text><polyline class="ar" points="280,140 312,140 312,214 340,214" marker-end="url(#ah)"/><circle cx="312" cy="186" r="9" fill="var(--dg-accent,var(--f-accent))"/>
<text class="num" x="312" y="190" text-anchor="middle">2</text><polyline class="ar" points="280,152 296,152 296,316 340,316" marker-end="url(#ah)"/><circle cx="296" cy="280" r="9" fill="var(--dg-accent,var(--f-accent))"/>
<text class="num" x="296" y="284" text-anchor="middle">3</text><polyline class="ar" points="280,164 288,164 288,424 340,424" marker-end="url(#ah)"/><circle cx="288" cy="390" r="9" fill="var(--dg-accent,var(--f-accent))"/>
<text class="num" x="288" y="394" text-anchor="middle">4</text><polyline class="ar" points="280,596 340,596" marker-end="url(#ah)"/><circle cx="310" cy="596" r="9" fill="var(--dg-accent,var(--f-accent))"/>
<text class="num" x="310" y="600" text-anchor="middle">5</text><polyline class="ar" points="640,214 700,214 700,148 746,148" marker-end="url(#ah)"/><polyline class="ar" points="640,320 690,320 690,398 746,398" marker-end="url(#ah)"/><polyline class="ard" points="640,424 676,424 676,212 746,212" marker-end="url(#ahm)"/><polyline class="ard" points="640,448 664,448 664,522 746,522" marker-end="url(#ahm)"/><polyline class="ar" points="640,584 716,584 716,276 746,276" marker-end="url(#ah)"/><polyline class="ar" points="640,616 724,616 724,586 746,586" marker-end="url(#ah)"/><polyline class="ar" points="490,642 490,710" marker-end="url(#ah)"/><text class="al" x="498" y="672" text-anchor="start">fetch</text><polyline class="ard" points="540,642 540,672 731,672 731,710" marker-end="url(#ahm)"/>
</svg>