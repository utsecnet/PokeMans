<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 576" width="1400" height="576" role="img" aria-label="Storage model: personal data and catalogue in app-private SQLite, secrets in the Keystore, with the rejected alternatives and why">
<title>Storage model: personal data and catalogue in app-private SQLite, secrets in the Keystore, with the rejected alternatives and why</title>
<style>
  svg {
    --f-ink:#0d1418; --f-muted:#5b6a77; --f-surface:#ffffff; --f-surface2:#f4f7f9;
    --f-line:#c9d3db; --f-zone:#e7edf2; --f-zoneline:#a9b8c4; --f-accent:#17607d;
    --f-shared:#1f6feb; --f-user:#7b4bb7; --f-secret:#a92e26;
    font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --f-ink:#e6edf3; --f-muted:#93a4b3; --f-surface:#1a2027; --f-surface2:#151b21;
      --f-line:#39444f; --f-zone:#161c22; --f-zoneline:#3d4954; --f-accent:#5cc2e8;
      --f-shared:#6ea8fe; --f-user:#c08cf5; --f-secret:#f0837a;
    }
  }
  .zn   { fill:var(--dg-zone,var(--f-zone)); stroke:var(--dg-zoneline,var(--f-zoneline)); stroke-width:1.25; stroke-dasharray:5 4; }
  .zt   { fill:var(--dg-muted,var(--f-muted)); font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .zc   { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .bx   { fill:var(--dg-surface,var(--f-surface)); stroke:var(--dg-line,var(--f-line)); stroke-width:1.25; }
  .bx2  { fill:var(--dg-surface2,var(--f-surface2)); stroke:var(--dg-line,var(--f-line)); stroke-width:1.25; }
  .bt   { fill:var(--dg-ink,var(--f-ink)); font-size:14px; font-weight:600; }
  .bs   { fill:var(--dg-muted,var(--f-muted)); font-size:12px; }
  .bm   { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .ar   { fill:none; stroke:var(--dg-accent,var(--f-accent)); stroke-width:1.6; }
  .ard  { fill:none; stroke:var(--dg-muted,var(--f-muted)); stroke-width:1.4; stroke-dasharray:5 4; }
  .al   { fill:var(--dg-accent,var(--f-accent)); font-size:11.5px; font-weight:500;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .alm  { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .tb   { fill:none; stroke:var(--dg-secret,var(--f-secret)); stroke-width:1.4; stroke-dasharray:7 5; opacity:.75; }
  .tbt  { fill:var(--dg-secret,var(--f-secret)); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .ttl  { fill:var(--dg-ink,var(--f-ink)); font-size:15px; font-weight:700; letter-spacing:.02em;
          font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif; }
  .num  { fill:var(--dg-surface,var(--f-surface)); font-size:11px; font-weight:700;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-accent,var(--f-accent))"/>
  </marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-muted,var(--f-muted))"/>
  </marker>
</defs>
<text class="ttl" x="40" y="44">Figure A2 · Storage — where each kind of data goes, and why</text>
<rect class="zn" x="40" y="70" width="1320" height="300" rx="8"/>
<text class="zt" x="54" y="91">App-private internal storage · /data/data/net.utsec.pokemans/</text>
<text class="zc" x="1346" y="91" text-anchor="end">the %appdata% replacement</text><rect class="bx" x="64" y="116" width="410" height="234" rx="5"/><path d="M64.5,121 a5,5 0 0 1 5,-5 h0 v224 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-user,var(--f-user))"/>
<rect x="65" y="117" width="4" height="232" fill="var(--dg-user,var(--f-user))"/><text class="bt" x="82" y="139">databases/personal.db</text><text class="bm" x="82" y="158">collection_boxes · collection_entries</text><text class="bm" x="82" y="174">want_lists · want_list_entries</text><text class="bm" x="82" y="190">card_price_history · fx_rates</text><text class="bm" x="82" y="206">settings</text><text class="bs" x="82" y="222">Irreplaceable. Nothing upstream can</text><text class="bs" x="82" y="238">reconstruct which cards you own, and a</text><text class="bs" x="82" y="254">price day not captured is gone —</text><text class="bs" x="82" y="270">the sources only ever serve today.</text><text class="bs" x="82" y="286">INCLUDED in Auto Backup.</text><rect class="bx" x="494" y="116" width="410" height="234" rx="5"/><text class="bt" x="508" y="139">databases/catalog.db</text><text class="bm" x="508" y="158">tcg_cards · tcg_card_variants</text><text class="bm" x="508" y="174">tcg_sets · tcg_series</text><text class="bm" x="508" y="190">pokemon · abilities · evolutions</text><text class="bs" x="508" y="206">~11 MB, 20,444 cards.</text><text class="bs" x="508" y="222">Shared but static — changes a handful</text><text class="bs" x="508" y="238">of times a year, when a set drops.</text><text class="bs" x="508" y="254">Re-downloadable, so it is EXCLUDED</text><text class="bs" x="508" y="270">from Auto Backup and shipped or</text><text class="bs" x="508" y="286">fetched on first run.</text><rect class="bx" x="924" y="116" width="412" height="234" rx="5"/><path d="M924.5,121 a5,5 0 0 1 5,-5 h0 v224 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-secret,var(--f-secret))"/>
<rect x="925" y="117" width="4" height="232" fill="var(--dg-secret,var(--f-secret))"/><text class="bt" x="942" y="139">EncryptedSharedPreferences</text><text class="bs" x="942" y="158">PokemonPriceTracker API key</text><text class="bs" x="942" y="174">Supabase read credential</text><text class="bs" x="942" y="190">Moved out of the database entirely.</text><text class="bs" x="942" y="206">linked_accounts held ciphertext with</text><text class="bs" x="942" y="222">the key elsewhere on disk, which is a</text><text class="bs" x="942" y="238">reasonable desktop compromise and the</text><text class="bs" x="942" y="254">wrong answer on a device that has a</text><text class="bs" x="942" y="270">hardware-backed Keystore.</text>
<rect class="zn" x="40" y="396" width="1320" height="150" rx="8"/>
<text class="zt" x="54" y="417">Ruled out</text>
<rect class="bx2" x="64" y="436" width="410" height="92" rx="5"/><text class="bt" x="78" y="459">External / shared storage</text><text class="bs" x="78" y="478">World-readable. Collection data has no business there,</text><text class="bs" x="78" y="494">and scoped storage makes it awkward regardless.</text><rect class="bx2" x="494" y="436" width="410" height="92" rx="5"/><text class="bt" x="508" y="459">localStorage / IndexedDB only</text><text class="bs" x="508" y="478">The advanced query language is SQL. Reimplementing it</text><text class="bs" x="508" y="494">over IndexedDB means rewriting the feature, not porting it.</text><rect class="bx2" x="924" y="436" width="412" height="92" rx="5"/><text class="bt" x="938" y="459">Everything hosted, nothing local</text><text class="bs" x="938" y="478">Kills offline. A collection app is used at shows and</text><text class="bs" x="938" y="494">conventions, which is exactly where signal is worst.</text>
</svg>