<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400" role="img" aria-label="Five phases: async port, hosted prices, Capacitor shell, touch redesign, Play Store">
<title>Five phases: async port, hosted prices, Capacitor shell, touch redesign, Play Store</title>
<style>
  svg {
    --f-ink:#0d1418; --f-muted:#5b6a77; --f-surface:#ffffff; --f-surface2:#f4f7f9;
    --f-line:#c9d3db; --f-zone:#e7edf2; --f-zoneline:#a9b8c4; --f-accent:#17607d;
    --f-shared:#1f6feb; --f-user:#7b4bb7; --f-secret:#a92e26;
    font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --f-ink:#e6edf3; --f-muted:#93a4b3; --f-surface:#1a2027; --f-surface2:#151b21;
      --f-line:#39444f; --f-zone:#161c22; --f-zoneline:#3d4954; --f-accent:#5cc2e8;
      --f-shared:#6ea8fe; --f-user:#c08cf5; --f-secret:#f0837a;
    }
  }
  .zn   { fill:var(--dg-zone,var(--f-zone)); stroke:var(--dg-zoneline,var(--f-zoneline)); stroke-width:1.25; stroke-dasharray:5 4; }
  .zt   { fill:var(--dg-muted,var(--f-muted)); font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .zc   { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .bx   { fill:var(--dg-surface,var(--f-surface)); stroke:var(--dg-line,var(--f-line)); stroke-width:1.25; }
  .bx2  { fill:var(--dg-surface2,var(--f-surface2)); stroke:var(--dg-line,var(--f-line)); stroke-width:1.25; }
  .bt   { fill:var(--dg-ink,var(--f-ink)); font-size:14px; font-weight:600; }
  .bs   { fill:var(--dg-muted,var(--f-muted)); font-size:12px; }
  .bm   { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .ar   { fill:none; stroke:var(--dg-accent,var(--f-accent)); stroke-width:1.6; }
  .ard  { fill:none; stroke:var(--dg-muted,var(--f-muted)); stroke-width:1.4; stroke-dasharray:5 4; }
  .al   { fill:var(--dg-accent,var(--f-accent)); font-size:11.5px; font-weight:500;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .alm  { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .tb   { fill:none; stroke:var(--dg-secret,var(--f-secret)); stroke-width:1.4; stroke-dasharray:7 5; opacity:.75; }
  .tbt  { fill:var(--dg-secret,var(--f-secret)); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .ttl  { fill:var(--dg-ink,var(--f-ink)); font-size:15px; font-weight:700; letter-spacing:.02em;
          font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif; }
  .num  { fill:var(--dg-surface,var(--f-surface)); font-size:11px; font-weight:700;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-accent,var(--f-accent))"/>
  </marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-muted,var(--f-muted))"/>
  </marker>
</defs>
<text class="ttl" x="40" y="44">Figure A4 · Order of work — each phase verifiable before the next begins</text><rect class="bx" x="64" y="96" width="240" height="168" rx="5"/><path d="M64.5,101 a5,5 0 0 1 5,-5 h0 v158 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-shared,var(--f-shared))"/>
<rect x="65" y="97" width="4" height="166" fill="var(--dg-shared,var(--f-shared))"/><text class="bt" x="82" y="119">Async port</text><text class="bs" x="82" y="138">The 260 call sites. Desktop only,</text><text class="bs" x="82" y="154">Express still running, browser still</text><text class="bs" x="82" y="170">testable. No Android SDK needed.</text><circle cx="84" cy="296" r="9" fill="var(--dg-accent,var(--f-accent))"/>
<text class="num" x="84" y="300" text-anchor="middle">1</text><polyline class="ar" points="308,180 324,180" marker-end="url(#ah)"/><rect class="bx" x="328" y="96" width="240" height="168" rx="5"/><text class="bt" x="342" y="119">Hosted prices</text><text class="bs" x="342" y="138">Supabase schema, the daily Action,</text><text class="bs" x="342" y="154">and the app reading price_current.</text><text class="bs" x="342" y="170">Independent of mobile.</text><circle cx="348" cy="296" r="9" fill="var(--dg-accent,var(--f-accent))"/>
<text class="num" x="348" y="300" text-anchor="middle">2</text><polyline class="ar" points="572,180 588,180" marker-end="url(#ah)"/><rect class="bx" x="592" y="96" width="240" height="168" rx="5"/><text class="bt" x="606" y="119">Capacitor shell</text><text class="bs" x="606" y="138">cap add android. Swap the driver.</text><text class="bs" x="606" y="154">First build on an emulator.</text><text class="bs" x="606" y="170">Needs Android Studio.</text><circle cx="612" cy="296" r="9" fill="var(--dg-accent,var(--f-accent))"/>
<text class="num" x="612" y="300" text-anchor="middle">3</text><polyline class="ar" points="836,180 852,180" marker-end="url(#ah)"/><rect class="bx" x="856" y="96" width="240" height="168" rx="5"/><text class="bt" x="870" y="119">Touch</text><text class="bs" x="870" y="138">Drag-and-drop is dead on touch.</text><text class="bs" x="870" y="154">Bottom sheet for the rail. Hit</text><text class="bs" x="870" y="170">targets. Swipe to remove.</text><circle cx="876" cy="296" r="9" fill="var(--dg-accent,var(--f-accent))"/>
<text class="num" x="876" y="300" text-anchor="middle">4</text><polyline class="ar" points="1100,180 1116,180" marker-end="url(#ah)"/><rect class="bx" x="1120" y="96" width="240" height="168" rx="5"/><text class="bt" x="1134" y="119">Play</text><text class="bs" x="1134" y="138">Privacy policy, data safety form,</text><text class="bs" x="1134" y="154">target API. Internal → closed →</text><text class="bs" x="1134" y="170">production. 12 testers, 14 days.</text><circle cx="1140" cy="296" r="9" fill="var(--dg-accent,var(--f-accent))"/>
<text class="num" x="1140" y="300" text-anchor="middle">5</text><text class="zc" x="64" y="352">Phase 1 is the only one on the critical path. Everything after it is additive, and phase 2 is useful whether or not the app ships.</text><text class="zc" x="64" y="374">The 14-day tester gate in phase 5 is a calendar constraint, not a work item — start it as soon as anything installs.</text>
</svg>