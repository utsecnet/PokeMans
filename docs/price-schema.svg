<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 740" width="1400" height="740" role="img" aria-label="Hosted price schema: price_current, price_history and sync_run in Supabase, with catalogue and personal data on the device">
<title>Hosted price schema: price_current, price_history and sync_run in Supabase, with catalogue and personal data on the device</title>
<style>
  svg {
    --f-ink:#0d1418; --f-muted:#5b6a77; --f-surface:#ffffff; --f-surface2:#f4f7f9;
    --f-line:#c9d3db; --f-zone:#e7edf2; --f-zoneline:#a9b8c4; --f-accent:#17607d;
    --f-shared:#1f6feb; --f-user:#7b4bb7; --f-secret:#a92e26;
    font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --f-ink:#e6edf3; --f-muted:#93a4b3; --f-surface:#1a2027; --f-surface2:#151b21;
      --f-line:#39444f; --f-zone:#161c22; --f-zoneline:#3d4954; --f-accent:#5cc2e8;
      --f-shared:#6ea8fe; --f-user:#c08cf5; --f-secret:#f0837a;
    }
  }
  .zn   { fill:var(--dg-zone,var(--f-zone)); stroke:var(--dg-zoneline,var(--f-zoneline)); stroke-width:1.25; stroke-dasharray:5 4; }
  .zt   { fill:var(--dg-muted,var(--f-muted)); font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .zc   { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .bx   { fill:var(--dg-surface,var(--f-surface)); stroke:var(--dg-line,var(--f-line)); stroke-width:1.25; }
  .bx2  { fill:var(--dg-surface2,var(--f-surface2)); stroke:var(--dg-line,var(--f-line)); stroke-width:1.25; }
  .bt   { fill:var(--dg-ink,var(--f-ink)); font-size:14px; font-weight:600; }
  .bs   { fill:var(--dg-muted,var(--f-muted)); font-size:12px; }
  .bm   { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .ar   { fill:none; stroke:var(--dg-accent,var(--f-accent)); stroke-width:1.6; }
  .ard  { fill:none; stroke:var(--dg-muted,var(--f-muted)); stroke-width:1.4; stroke-dasharray:5 4; }
  .al   { fill:var(--dg-accent,var(--f-accent)); font-size:11.5px; font-weight:500;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .alm  { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .tb   { fill:none; stroke:var(--dg-secret,var(--f-secret)); stroke-width:1.4; stroke-dasharray:7 5; opacity:.75; }
  .tbt  { fill:var(--dg-secret,var(--f-secret)); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .ttl  { fill:var(--dg-ink,var(--f-ink)); font-size:15px; font-weight:700; letter-spacing:.02em;
          font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif; }
  .num  { fill:var(--dg-surface,var(--f-surface)); font-size:11px; font-weight:700;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-accent,var(--f-accent))"/>
  </marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-muted,var(--f-muted))"/>
  </marker>
</defs>
<text class="ttl" x="40" y="44">Figure 5 · Hosted price schema — what lives in Postgres and what stays on the device</text>
<rect class="zn" x="40" y="70" width="700" height="470" rx="8"/>
<text class="zt" x="54" y="91">Supabase · Postgres</text>
<text class="zc" x="726" y="91" text-anchor="end">shared + live</text><rect class="bx" x="64" y="116" width="320" height="176" rx="5"/><path d="M64.5,121 a5,5 0 0 1 5,-5 h0 v166 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-shared,var(--f-shared))"/>
<rect x="65" y="117" width="4" height="174" fill="var(--dg-shared,var(--f-shared))"/><text class="bt" x="82" y="139">price_current</text><text class="bm" x="82" y="158">PK card_id, variant_position, source</text><text class="bm" x="82" y="174">currency, market, low</text><text class="bm" x="82" y="190">captured_on, updated_at</text><text class="bs" x="82" y="206">One row per priced thing. Rewritten</text><text class="bs" x="82" y="222">every run, changed or not, so a lookup</text><text class="bs" x="82" y="238">is a PK hit. ~39k rows, fixed size.</text><rect class="bx" x="400" y="116" width="320" height="176" rx="5"/><path d="M400.5,121 a5,5 0 0 1 5,-5 h0 v166 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-shared,var(--f-shared))"/>
<rect x="401" y="117" width="4" height="174" fill="var(--dg-shared,var(--f-shared))"/><text class="bt" x="418" y="139">price_history</text><text class="bm" x="418" y="158">PK id · UQ card, variant, source, day</text><text class="bm" x="418" y="174">currency, market, low, captured_on</text><text class="bs" x="418" y="190">Append-only, changes only. 87.3% of</text><text class="bs" x="418" y="206">days are unchanged, so this holds ~13%</text><text class="bs" x="418" y="222">of a full snapshot. A step series, not</text><text class="bs" x="418" y="238">a line. ~5k rows/day · ~1.8M/year</text><rect class="bx" x="64" y="316" width="320" height="128" rx="5"/><text class="bt" x="78" y="339">sync_run</text><text class="bm" x="78" y="358">started_at, finished_at, status</text><text class="bm" x="78" y="374">cards_seen, changed, failed</text><text class="bs" x="78" y="390">The job fails silently otherwise, and</text><text class="bs" x="78" y="406">a missed day cannot be recovered —</text><text class="bs" x="78" y="422">upstreams only ever serve today.</text><rect class="bx" x="400" y="316" width="320" height="128" rx="5"/><text class="bt" x="414" y="339">record_prices(jsonb)</text><text class="bs" x="414" y="358">Upserts the batch into current and</text><text class="bs" x="414" y="374">appends only genuine changes to</text><text class="bs" x="414" y="390">history. The diff happens in the</text><text class="bs" x="414" y="406">database, so the job never fetches</text><text class="bs" x="414" y="422">previous values to compare.</text><text class="zc" x="64" y="472">RLS on, no read policy — the anon key ships in any client bundle that uses it,</text><text class="zc" x="64" y="492">and that would be public redistribution of free-tier price data.</text>
<rect class="zn" x="780" y="70" width="580" height="470" rx="8"/>
<text class="zt" x="794" y="91">On the device · SQLite</text>
<text class="zc" x="1346" y="91" text-anchor="end">static + personal</text><rect class="bx2" x="804" y="116" width="252" height="176" rx="5"/><text class="bt" x="818" y="139">catalog.sqlite</text><text class="bm" x="818" y="158">tcg_cards · tcg_card_variants</text><text class="bm" x="818" y="174">tcg_sets · pokemon · abilities</text><text class="bs" x="818" y="190">Shared, but static — changes a</text><text class="bs" x="818" y="206">few times a year. Synced down,</text><text class="bs" x="818" y="222">queried locally. 11 MB.</text><rect class="bx2" x="1072" y="116" width="264" height="176" rx="5"/><path d="M1072.5,121 a5,5 0 0 1 5,-5 h0 v166 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-user,var(--f-user))"/>
<rect x="1073" y="117" width="4" height="174" fill="var(--dg-user,var(--f-user))"/><text class="bt" x="1090" y="139">personal.sqlite</text><text class="bm" x="1090" y="158">collection_boxes · collection_entries</text><text class="bm" x="1090" y="174">want_lists · want_list_entries</text><text class="bm" x="1090" y="190">settings · linked_accounts · fx_rates</text><text class="bs" x="1090" y="206">User data. Never leaves the device</text><text class="bs" x="1090" y="222">until there are users to scope it to.</text><rect class="bx" x="804" y="316" width="532" height="150" rx="5"/><text class="bt" x="818" y="339">Why the catalogue is not hosted</text><text class="bs" x="818" y="358">The advanced search falls back to filtering the whole catalogue in the</text><text class="bs" x="818" y="374">client when a query uses operators SQL cannot push down. Measured at</text><text class="bs" x="818" y="390">12.4 MB and 8.7 s over loopback. Remote, that is not a slow feature —</text><text class="bs" x="818" y="406">it is a broken one, and the app stops working offline.</text>
<rect class="zn" x="40" y="566" width="1320" height="150" rx="8"/>
<text class="zt" x="54" y="587">Daily refresh</text>
<rect class="bx" x="64" y="606" width="250" height="88" rx="5"/><text class="bt" x="78" y="629">GitHub Action</text><text class="bs" x="78" y="648">20,444 cards, concurrency 8</text><text class="bs" x="78" y="664">Measured: 4.8 min · 43 MB</text><rect class="bx2" x="350" y="606" width="230" height="88" rx="5"/><text class="bt" x="364" y="629">TCGdex</text><text class="bs" x="364" y="648">One request per card</text><text class="bs" x="364" y="664">Both marketplaces, daily</text><rect class="bx" x="1090" y="606" width="246" height="88" rx="5"/><text class="bt" x="1104" y="629">App server</text><text class="bs" x="1104" y="648">convert() · ensureRates()</text><text class="bs" x="1104" y="664">latestPricesFor() unchanged</text><polyline class="ar" points="314,650 344,650" marker-end="url(#ah)" marker-start="url(#ah)"/><text class="al" x="329" y="641" text-anchor="middle">fetch</text><polyline class="ar" points="189,604 189,552 26,552 26,200 58,200" marker-end="url(#ah)"/><text class="al" x="112" y="544" text-anchor="middle">record_prices()</text><polyline class="ar" points="1086,660 760,660 760,300 744,300" marker-end="url(#ah)"/><text class="al" x="925" y="652" text-anchor="middle">reads current + history</text><text class="zc" x="596" y="706">Do not trust GitHub’s schedule: trigger · late by 10–60 min, self-disables after 60 days idle</text>
</svg>