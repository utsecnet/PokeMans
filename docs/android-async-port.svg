<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img" aria-label="The async port in three stages: synchronous today, asynchronous on the desktop where it is testable, then the same code on Android with the driver swapped">
<title>The async port in three stages: synchronous today, asynchronous on the desktop where it is testable, then the same code on Android with the driver swapped</title>
<style>
  svg {
    --f-ink:#0d1418; --f-muted:#5b6a77; --f-surface:#ffffff; --f-surface2:#f4f7f9;
    --f-line:#c9d3db; --f-zone:#e7edf2; --f-zoneline:#a9b8c4; --f-accent:#17607d;
    --f-shared:#1f6feb; --f-user:#7b4bb7; --f-secret:#a92e26;
    font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --f-ink:#e6edf3; --f-muted:#93a4b3; --f-surface:#1a2027; --f-surface2:#151b21;
      --f-line:#39444f; --f-zone:#161c22; --f-zoneline:#3d4954; --f-accent:#5cc2e8;
      --f-shared:#6ea8fe; --f-user:#c08cf5; --f-secret:#f0837a;
    }
  }
  .zn   { fill:var(--dg-zone,var(--f-zone)); stroke:var(--dg-zoneline,var(--f-zoneline)); stroke-width:1.25; stroke-dasharray:5 4; }
  .zt   { fill:var(--dg-muted,var(--f-muted)); font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .zc   { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .bx   { fill:var(--dg-surface,var(--f-surface)); stroke:var(--dg-line,var(--f-line)); stroke-width:1.25; }
  .bx2  { fill:var(--dg-surface2,var(--f-surface2)); stroke:var(--dg-line,var(--f-line)); stroke-width:1.25; }
  .bt   { fill:var(--dg-ink,var(--f-ink)); font-size:14px; font-weight:600; }
  .bs   { fill:var(--dg-muted,var(--f-muted)); font-size:12px; }
  .bm   { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .ar   { fill:none; stroke:var(--dg-accent,var(--f-accent)); stroke-width:1.6; }
  .ard  { fill:none; stroke:var(--dg-muted,var(--f-muted)); stroke-width:1.4; stroke-dasharray:5 4; }
  .al   { fill:var(--dg-accent,var(--f-accent)); font-size:11.5px; font-weight:500;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .alm  { fill:var(--dg-muted,var(--f-muted)); font-size:11.5px; font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .tb   { fill:none; stroke:var(--dg-secret,var(--f-secret)); stroke-width:1.4; stroke-dasharray:7 5; opacity:.75; }
  .tbt  { fill:var(--dg-secret,var(--f-secret)); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .ttl  { fill:var(--dg-ink,var(--f-ink)); font-size:15px; font-weight:700; letter-spacing:.02em;
          font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif; }
  .num  { fill:var(--dg-surface,var(--f-surface)); font-size:11px; font-weight:700;
          font-family:"IBM Plex Mono",ui-monospace,monospace; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-accent,var(--f-accent))"/>
  </marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--dg-muted,var(--f-muted))"/>
  </marker>
</defs>
<text class="ttl" x="40" y="44">Figure A3 · The async port — the expensive part, done before Capacitor is in the picture</text>
<rect class="zn" x="40" y="70" width="1320" height="176" rx="8"/>
<text class="zt" x="54" y="91">Today · synchronous</text>
<rect class="bx" x="64" y="112" width="300" height="110" rx="5"/><text class="bt" x="78" y="135">Routes</text><text class="bm" x="78" y="154">const rows = all(sql, params)</text><text class="bs" x="78" y="170">Returns rows, not a promise.</text><text class="bs" x="78" y="186">260 call sites, 27 files.</text><rect class="bx" x="388" y="112" width="300" height="110" rx="5"/><text class="bt" x="402" y="135">node:sqlite</text><text class="bm" x="402" y="154">DatabaseSync</text><text class="bs" x="402" y="170">In-process. A query is a</text><text class="bs" x="402" y="186">function call.</text><rect class="bx" x="712" y="112" width="300" height="110" rx="5"/><text class="bt" x="726" y="135">Express</text><text class="bs" x="726" y="154">Runs on localhost.</text><text class="bs" x="726" y="170">Has no equivalent on a phone.</text><rect class="bx2" x="1036" y="112" width="300" height="110" rx="5"/><text class="bt" x="1050" y="135">Browser</text><text class="bs" x="1050" y="154">Fetches /api/*</text>
<rect class="zn" x="40" y="274" width="1320" height="176" rx="8"/>
<text class="zt" x="54" y="295">After · asynchronous, still on the desktop</text>
<rect class="bx" x="64" y="316" width="300" height="110" rx="5"/><text class="bt" x="78" y="339">Routes</text><text class="bm" x="78" y="358">const rows = await db.all(...)</text><text class="bs" x="78" y="374">Await pushes up through every</text><text class="bs" x="78" y="390">caller. This is the whole job.</text><rect class="bx" x="388" y="316" width="300" height="110" rx="5"/><path d="M388.5,321 a5,5 0 0 1 5,-5 h0 v100 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-shared,var(--f-shared))"/>
<rect x="389" y="317" width="4" height="108" fill="var(--dg-shared,var(--f-shared))"/><text class="bt" x="406" y="339">SqlDatabase</text><text class="bm" x="406" y="358">all · get · run · exec</text><text class="bm" x="406" y="374">transaction</text><text class="bs" x="406" y="390">One interface, two drivers.</text><rect class="bx" x="712" y="316" width="300" height="110" rx="5"/><text class="bt" x="726" y="339">node:sqlite driver</text><text class="bs" x="726" y="358">Wrapped to return promises.</text><text class="bs" x="726" y="374">Express still runs, browser still</text><text class="bs" x="726" y="390">works — so this step is testable.</text><rect class="bx2" x="1036" y="316" width="300" height="110" rx="5"/><text class="bt" x="1050" y="339">Browser</text><text class="bs" x="1050" y="358">Unchanged</text>
<rect class="zn" x="40" y="478" width="1320" height="176" rx="8"/>
<text class="zt" x="54" y="499">Then · the same code on Android</text>
<rect class="bx" x="64" y="520" width="300" height="110" rx="5"/><text class="bt" x="78" y="543">Routes</text><text class="bs" x="78" y="562">Unchanged from the step above.</text><text class="bs" x="78" y="578">Already async, already tested.</text><rect class="bx" x="388" y="520" width="300" height="110" rx="5"/><path d="M388.5,525 a5,5 0 0 1 5,-5 h0 v100 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-shared,var(--f-shared))"/>
<rect x="389" y="521" width="4" height="108" fill="var(--dg-shared,var(--f-shared))"/><text class="bt" x="406" y="543">SqlDatabase</text><text class="bs" x="406" y="562">Same interface.</text><rect class="bx" x="712" y="520" width="300" height="110" rx="5"/><path d="M712.5,525 a5,5 0 0 1 5,-5 h0 v100 h0 a5,5 0 0 1 -5,-5 z" fill="var(--dg-user,var(--f-user))"/>
<rect x="713" y="521" width="4" height="108" fill="var(--dg-user,var(--f-user))"/><text class="bt" x="730" y="543">Capacitor SQLite driver</text><text class="bs" x="730" y="562">Crosses the WebView bridge.</text><text class="bs" x="730" y="578">Cannot be synchronous — which is</text><text class="bs" x="730" y="594">why the conversion is unavoidable.</text><rect class="bx2" x="1036" y="520" width="300" height="110" rx="5"/><text class="bt" x="1050" y="543">WebView</text><text class="bs" x="1050" y="562">Calls the query layer directly.</text><text class="bs" x="1050" y="578">No HTTP, no server.</text><polyline class="ar" points="700,226 700,310" marker-end="url(#ah)"/><text class="al" x="708" y="270" text-anchor="start">the work</text><polyline class="ar" points="700,430 700,514" marker-end="url(#ah)"/><text class="al" x="708" y="474" text-anchor="start">swap the driver</text><text class="zc" x="64" y="676">Doing the conversion first means an async bug and a native-shell bug are never being diagnosed at the same time.</text>
</svg>